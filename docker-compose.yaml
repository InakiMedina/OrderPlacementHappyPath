services:

  order-placement:
    build: ./services/orderPlacement
    container_name: order-placement-service
    depends_on:
      - rabbitmq
    volumes:
      - ./services/orderPlacement:/app
      - ./logs:/var/log/app
    environment:
      - RABBITMQ_HOST=rabbitmq

  rabbitmq: 
    image: rabbitmq:3-alpine
    container_name: place-order-broker
    ports: 
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  payment:
    build: ./services/payment
    container_name: payment-service
    depends_on:
      - rabbitmq
    volumes:
      - ./services/payment:/app
      - ./logs:/var/log/app
    environment:
      - RABBITMQ_HOST=rabbitmq
      - PYTHONUNBUFFERED=1


volumes:
  rabbitmq_data: